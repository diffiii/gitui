name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the tag matches the package version
        run: |
          version=$(jq -r .version apps/cli/package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/cli/package.json version $version"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bunx vp check
      - run: bun run typecheck
      - run: bun test
      - run: bun run --cwd apps/cli build
      - run: RUNTIME=bun scripts/smoke.sh
      # After the build: the tooling (vite-plus) needs a newer Node than the package's floor.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.15.0 # the engines floor of the published package (22.15 fixed strict Content-Length checks, which Effect's Node server turns on)
      - run: scripts/smoke.sh
      # npm refuses to run inside the repo (the root devEngines names bun), so pack with bun and
      # publish the tarball from outside it. Trusted publishing adds provenance on its own.
      - run: bun pm pack --destination "$RUNNER_TEMP/package"
        working-directory: apps/cli
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: package
          path: ${{ runner.temp }}/package/diffiii-gitui-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    # Runs no repo code: only the tarball the build job made, so the OIDC token never meets the dev dependencies.
    needs: build
    runs-on: ubuntu-latest
    # Bind the npm trusted publisher to this environment, so only this job can publish.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm 11.21.3 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11.21.3 && npm --version
        working-directory: ${{ runner.temp }}
      - run: npm publish ./diffiii-gitui-*.tgz
        working-directory: ${{ runner.temp }}/package
