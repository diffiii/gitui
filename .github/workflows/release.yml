name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check the tag matches the package version
        run: |
          version=$(jq -r .version apps/cli/package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/cli/package.json version $version"
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    # Runs no repo code: only the tarball the CI run packed, so the OIDC token never meets the dev dependencies.
    needs: [tag-check, ci]
    runs-on: ubuntu-latest
    # Bind the npm trusted publisher to this environment, so only this job can publish.
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC), which adds provenance on its own
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: package
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.3 # bundles npm 11.19.1, newer than the 11.5.1 trusted publishing needs
          registry-url: https://registry.npmjs.org
      - run: npm publish ./diffiii-gitui-*.tgz
