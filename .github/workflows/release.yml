name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Bind the npm trusted publisher to this environment, so only this job can publish.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the package version
        run: |
          version=$(jq -r .version apps/cli/package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/cli/package.json version $version"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bunx vp check
      - run: bun run typecheck
      - run: bun test
      - run: bun run --cwd apps/cli build
      # After the build: the tooling (vite-plus) needs a newer Node than the package's floor.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.1.0 # the engines floor of the published package
      - run: scripts/smoke.sh
      # npm refuses to run inside the repo (the root devEngines names bun), so pack with bun and
      # publish the tarball from outside it. Trusted publishing adds provenance on its own.
      - run: bun pm pack --destination "$RUNNER_TEMP"
        working-directory: apps/cli
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm 11.5.1 or later (trusted publishing needs it)
        run: npm install -g npm@^11.5.1 && npm --version
        working-directory: ${{ runner.temp }}
      - run: npm publish ./diffiii-gitui-*.tgz
        working-directory: ${{ runner.temp }}
