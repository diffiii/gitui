name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Format, lint, type check
        run: bunx vp check
      - name: Type check (project references)
        run: bunx tsc -b
      - name: Test
        run: bun test
      - name: Build
        run: bun run --cwd apps/cli build
      # After the build: the tooling (vite-plus) needs a newer Node than the package's floor.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.1.0 # the engines floor of the published package
      - name: Smoke test the bundle under Node
        run: scripts/smoke.sh
